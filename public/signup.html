<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up — NEUTRALIZE.AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --border: #1e1e2e;
      --accent: #e8ff6b;
      --accent2: #6bffd4;
      --text: #f0f0f8;
      --muted: #6b6b8a;
      --error: #ff6b6b;
      --success: #6bffd4;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(107,255,212,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(107,255,212,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridShift 20s linear infinite;
      pointer-events: none;
    }

    @keyframes gridShift {
      0% { transform: translateY(0); }
      100% { transform: translateY(60px); }
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      opacity: 0.12;
    }
    .orb-1 { width: 350px; height: 350px; background: var(--accent2); top: -80px; left: -80px; animation: float1 9s ease-in-out infinite; }
    .orb-2 { width: 300px; height: 300px; background: var(--accent); bottom: -60px; right: -60px; animation: float2 11s ease-in-out infinite; }

    @keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(20px,30px)} }
    @keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-25px,-20px)} }

    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 44px;
      width: 100%;
      max-width: 440px;
      z-index: 10;
      animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 21px;
      background: linear-gradient(135deg, rgba(107,255,212,0.15), transparent 50%, rgba(232,255,107,0.1));
      z-index: -1;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-dot {
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 32px;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 36px;
    }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--accent2);
      box-shadow: 0 0 0 3px rgba(107,255,212,0.1);
    }

    input::placeholder { color: var(--muted); }

    .alert {
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .alert.error {
      background: rgba(255,107,107,0.1);
      border: 1px solid rgba(255,107,107,0.3);
      color: var(--error);
    }

    .alert.success {
      background: rgba(107,255,212,0.1);
      border: 1px solid rgba(107,255,212,0.3);
      color: var(--success);
    }

    .alert.show { display: block; }

    /* Password strength bar */
    .strength-bar {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }

    .strength-fill {
      height: 100%;
      width: 0%;
      border-radius: 2px;
      transition: width 0.3s, background 0.3s;
    }

    .strength-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    .limit-info {
      background: rgba(232,255,107,0.06);
      border: 1px solid rgba(232,255,107,0.15);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .limit-info span { font-size: 18px; }

    /* Google button */
    .btn-google {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      margin-bottom: 4px;
    }
    .btn-google:hover {
      background: #111118;
      border-color: var(--muted);
      box-shadow: 0 0 0 3px rgba(107,255,212,0.06);
    }
    .btn-google:active { transform: translateY(1px); }
    .btn-google:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn {
      width: 100%;
      background: var(--accent);
      color: #0a0a0f;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      margin-top: 8px;
      letter-spacing: 0.02em;
    }

    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(232,255,107,0.3); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .switch-link {
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      margin-top: 24px;
    }

    .switch-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .switch-link a:hover { text-decoration: underline; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(10,10,15,0.3);
      border-top-color: #0a0a0f;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    .spinner-dark {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(240,240,248,0.15);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card">
    <div class="logo"><div class="logo-dot"></div> NEUTRALIZE.AI</div>
    <h1>Create account</h1>
    <p class="subtitle">Start humanizing — free, up to 1,000 words a day.</p>

    <div class="limit-info">
      <span>📝</span>
      <div>Free plan includes <strong style="color:var(--accent)">1,000 words/day</strong>. Resets every midnight.</div>
    </div>

    <div class="alert error" id="errorMsg"></div>
    <div class="alert success" id="successMsg"></div>

    <!-- Google Sign-Up -->
    <button class="btn-google" id="googleBtn" onclick="handleGoogleLogin()">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 20-9 20-20 0-1.3-.1-2.7-.4-4z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 16.3 4 9.7 8.6 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5l-6.2-5.2C29.4 35.6 26.8 36 24 36c-5.2 0-9.6-2.9-11.3-7.1l-6.5 5C9.7 39.5 16.3 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20H24v8h11.3c-.9 2.5-2.6 4.6-4.8 6l6.2 5.2C40.4 35.5 44 30.2 44 24c0-1.3-.1-2.7-.4-4z"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider">or sign up with email</div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Min. 8 characters" autocomplete="new-password" oninput="checkStrength(this.value)"/>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      <div class="strength-label" id="strengthLabel"></div>
    </div>

    <div class="field">
      <label>Confirm Password</label>
      <input type="password" id="confirm" placeholder="••••••••" autocomplete="new-password"/>
    </div>

    <button class="btn" id="signupBtn" onclick="handleSignup()">Create account</button>

    <div class="switch-link">
      Already have an account? <a href="/login.html">Sign in</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="/firebase-config.js"></script>
  <script>
    auth.onAuthStateChanged(user => {
      if (user) window.location.href = '/';
    });

    // Google sign-up (Firebase handles new vs existing accounts automatically)
    async function handleGoogleLogin() {
      const errEl = document.getElementById('errorMsg');
      const okEl  = document.getElementById('successMsg');
      const googleBtn = document.getElementById('googleBtn');

      errEl.classList.remove('show');
      okEl.classList.remove('show');

      googleBtn.disabled = true;
      googleBtn.innerHTML = '<span class="spinner-dark"></span>Signing in...';

      try {
        await auth.signInWithPopup(provider);
        okEl.textContent = '✓ Account ready! Redirecting...';
        okEl.classList.add('show');
        setTimeout(() => window.location.href = '/', 1000);
      } catch (err) {
        const msgs = {
          'auth/popup-closed-by-user': 'Login cancelled.',
          'auth/popup-blocked': 'Popup blocked. Please allow popups for this site.',
          'auth/cancelled-popup-request': 'Login cancelled.',
        };
        errEl.textContent = msgs[err.code] || err.message;
        errEl.classList.add('show');
        googleBtn.disabled = false;
        googleBtn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 20-9 20-20 0-1.3-.1-2.7-.4-4z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 16.3 4 9.7 8.6 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5l-6.2-5.2C29.4 35.6 26.8 36 24 36c-5.2 0-9.6-2.9-11.3-7.1l-6.5 5C9.7 39.5 16.3 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20H24v8h11.3c-.9 2.5-2.6 4.6-4.8 6l6.2 5.2C40.4 35.5 44 30.2 44 24c0-1.3-.1-2.7-.4-4z"/>
          </svg>
          Continue with Google`;
      }
    }

    function checkStrength(val) {
      const fill = document.getElementById('strengthFill');
      const label = document.getElementById('strengthLabel');
      if (!val) { fill.style.width = '0%'; label.textContent = ''; return; }

      let score = 0;
      if (val.length >= 8) score++;
      if (val.length >= 12) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      const levels = [
        { pct: '20%', color: '#ff6b6b', text: 'Weak' },
        { pct: '40%', color: '#ffaa6b', text: 'Fair' },
        { pct: '60%', color: '#ffd96b', text: 'Good' },
        { pct: '80%', color: '#a8ff6b', text: 'Strong' },
        { pct: '100%', color: '#6bffd4', text: 'Excellent' },
      ];
      const lvl = levels[Math.min(score - 1, 4)] || levels[0];
      fill.style.width = lvl.pct;
      fill.style.background = lvl.color;
      label.textContent = lvl.text;
      label.style.color = lvl.color;
    }

    async function handleSignup() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;
      const btn      = document.getElementById('signupBtn');
      const errEl    = document.getElementById('errorMsg');
      const okEl     = document.getElementById('successMsg');

      errEl.classList.remove('show');
      okEl.classList.remove('show');

      if (!email || !password || !confirm) {
        errEl.textContent = 'Please fill in all fields.';
        errEl.classList.add('show');
        return;
      }

      if (password.length < 8) {
        errEl.textContent = 'Password must be at least 8 characters.';
        errEl.classList.add('show');
        return;
      }

      if (password !== confirm) {
        errEl.textContent = 'Passwords do not match.';
        errEl.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Creating account...';

      try {
        await auth.createUserWithEmailAndPassword(email, password);
        okEl.textContent = '✓ Account created! Redirecting...';
        okEl.classList.add('show');
        setTimeout(() => window.location.href = '/', 1200);
      } catch (err) {
        const msgs = {
          'auth/email-already-in-use': 'An account with this email already exists.',
          'auth/invalid-email': 'Invalid email address.',
          'auth/weak-password': 'Password is too weak.',
        };
        errEl.textContent = msgs[err.code] || err.message;
        errEl.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = 'Create account';
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleSignup();
    });
  </script>
</body>
</html>
